<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Danttel SchoolHub - Register School</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #07111f, #102a43);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: white;
    }

    .card {
      width: 100%;
      max-width: 520px;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.12);
      backdrop-filter: blur(18px);
      border-radius: 22px;
      padding: 28px;
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #b8c4d6;
      margin-bottom: 25px;
      font-size: 14px;
    }

    .section {
      margin-top: 20px;
      margin-bottom: 10px;
      font-size: 15px;
      font-weight: bold;
      color: #6ee7ff;
    }

    label {
      display: block;
      margin: 12px 0 6px;
      font-size: 13px;
      color: #d9e3f0;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 10px;
      outline: none;
      background: rgba(255,255,255,.08);
      color: white;
      font-size: 14px;
    }

    input::placeholder {
      color: #9caabd;
    }

    input:focus {
      border-color: #6ee7ff;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: none;
      border-radius: 11px;
      background: #18b7d8;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
    }

    .message {
      margin-top: 15px;
      padding: 12px;
      border-radius: 10px;
      display: none;
      font-size: 14px;
      line-height: 1.5;
    }

    .success {
      display: block;
      background: rgba(34,197,94,.15);
      border: 1px solid rgba(34,197,94,.4);
      color: #86efac;
    }

    .error {
      display: block;
      background: rgba(239,68,68,.15);
      border: 1px solid rgba(239,68,68,.4);
      color: #fca5a5;
    }

    .login {
      text-align: center;
      margin-top: 20px;
      color: #b8c4d6;
      font-size: 14px;
    }

    .login a {
      color: #6ee7ff;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="card">

  <h1>🏫 Danttel SchoolHub</h1>

  <div class="subtitle">
    Register your school and create your administrator account.
  </div>

  <form id="registerForm">

    <div class="section">School Information</div>

    <label>School Name</label>
    <input
      type="text"
      id="schoolName"
      placeholder="Enter school name"
      required
    >

    <label>School Email</label>
    <input
      type="email"
      id="schoolEmail"
      placeholder="school@example.com"
      required
    >

    <label>School Phone</label>
    <input
      type="tel"
      id="schoolPhone"
      placeholder="08012345678"
      required
    >

    <label>WhatsApp Number</label>
    <input
      type="tel"
      id="schoolWhatsapp"
      placeholder="08012345678"
    >

    <label>School Address</label>
    <input
      type="text"
      id="schoolAddress"
      placeholder="School address"
      required
    >

    <div class="section">Administrator Account</div>

    <label>Administrator Name</label>
    <input
      type="text"
      id="adminName"
      placeholder="Full name"
      required
    >

    <label>Administrator Email</label>
    <input
      type="email"
      id="adminEmail"
      placeholder="admin@example.com"
      required
    >

    <label>Phone</label>
    <input
      type="tel"
      id="adminPhone"
      placeholder="08012345678"
    >

    <label>Password</label>
    <input
      type="password"
      id="password"
      placeholder="Create password"
      minlength="6"
      required
    >

    <label>Confirm Password</label>
    <input
      type="password"
      id="confirmPassword"
      placeholder="Confirm password"
      minlength="6"
      required
    >

    <button id="registerBtn" type="submit">
      Create School Account
    </button>

  </form>

  <div id="message" class="message"></div>

  <div class="login">
    Already have an account?
    <a href="login.html">Sign in</a>
  </div>

</div>

<script>
  const SUPABASE_URL =
    "https://cxdqgulipvhgpiwrjvgo.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_MdS04D2lfMwcU2Du8rjnwQ_Ffu3kXRU";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

  const form = document.getElementById("registerForm");
  const button = document.getElementById("registerBtn");
  const message = document.getElementById("message");

  function showMessage(text, type) {
    message.textContent = text;
    message.className = "message " + type;
  }

  form.addEventListener("submit", async function(event) {

    event.preventDefault();

    const schoolName =
      document.getElementById("schoolName").value.trim();

    const schoolEmail =
      document.getElementById("schoolEmail").value.trim();

    const schoolPhone =
      document.getElementById("schoolPhone").value.trim();

    const schoolWhatsapp =
      document.getElementById("schoolWhatsapp").value.trim();

    const schoolAddress =
      document.getElementById("schoolAddress").value.trim();

    const adminName =
      document.getElementById("adminName").value.trim();

    const adminEmail =
      document.getElementById("adminEmail").value.trim();

    const adminPhone =
      document.getElementById("adminPhone").value.trim();

    const password =
      document.getElementById("password").value;

    const confirmPassword =
      document.getElementById("confirmPassword").value;

    if (password !== confirmPassword) {
      showMessage("Passwords do not match.", "error");
      return;
    }

    button.disabled = true;
    button.textContent = "Creating account...";

    try {

      const { data, error } =
        await supabaseClient.auth.signUp({

          email: adminEmail,

          password: password,

          options: {
            data: {
              full_name: adminName,
              phone: adminPhone,

              school_name: schoolName,
              school_email: schoolEmail,
              school_phone: schoolPhone,
              school_whatsapp: schoolWhatsapp,
              school_address: schoolAddress
            }
          }

        });

      if (error) {
        throw error;
      }

      showMessage(
        "Account created successfully! You can now sign in.",
        "success"
      );

      form.reset();

      setTimeout(() => {
        window.location.href = "login.html";
      }, 2000);

    } catch (error) {

      console.error(error);

      showMessage(
        error.message || "Registration failed.",
        "error"
      );

      button.disabled = false;
      button.textContent = "Create School Account";
    }

  });
</script>

</body>
</html>
