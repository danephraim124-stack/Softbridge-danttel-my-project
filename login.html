<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Danttel SchoolHub - Login</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: white;
      background: linear-gradient(135deg, #06111f, #12395a);
    }

    .box {
      width: 100%;
      max-width: 430px;
      padding: 32px;
      border-radius: 22px;
      background: rgba(255,255,255,.08);
      backdrop-filter: blur(15px);
      border: 1px solid rgba(255,255,255,.15);
      box-shadow: 0 20px 50px rgba(0,0,0,.3);
    }

    .logo {
      text-align: center;
      margin-bottom: 28px;
    }

    .logo h1 {
      font-size: 30px;
    }

    .logo span {
      color: #42d392;
    }

    .logo p {
      color: #b7c5d6;
      margin-top: 8px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 18px;
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 12px;
      outline: none;
      background: rgba(0,0,0,.2);
      color: white;
      font-size: 15px;
    }

    input:focus {
      border-color: #42d392;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: #42d392;
      color: #06120d;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
    }

    #message {
      display: none;
      margin-top: 18px;
      padding: 12px;
      border-radius: 10px;
      text-align: center;
      font-size: 14px;
    }

    .error {
      display: block !important;
      background: rgba(255,70,70,.15);
      color: #ff9999;
    }

    .success {
      display: block !important;
      background: rgba(66,211,146,.15);
      color: #70f0b2;
    }

    .register {
      text-align: center;
      margin-top: 22px;
      color: #b7c5d6;
    }

    .register a {
      color: #42d392;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="box">

    <div class="logo">
      <h1>Danttel<span>SchoolHub</span></h1>
      <p>School Management Platform</p>
    </div>

    <form id="loginForm">

      <label>Email</label>
      <input
        type="email"
        id="email"
        placeholder="Enter your email"
        required
      >

      <label>Password</label>
      <input
        type="password"
        id="password"
        placeholder="Enter your password"
        required
      >

      <button id="loginBtn" type="submit">
        Sign In
      </button>

    </form>

    <div id="message"></div>

    <div class="register">
      Don't have an account?
      <a href="register.html">Register your school</a>
    </div>

  </div>

<script>

  const SUPABASE_URL =
    "https://cxdqgulipvhgpiwrjvgo.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_MdS04D2lfMwcU2Du8rjnwQ_Ffu3kXRU";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  const form =
    document.getElementById("loginForm");

  const button =
    document.getElementById("loginBtn");

  const message =
    document.getElementById("message");


  function showMessage(text, type) {

    message.textContent = text;
    message.className = type;

  }


  form.addEventListener("submit", async function(e) {

    e.preventDefault();

    button.disabled = true;
    button.textContent = "Signing in...";

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;


    const { data, error } =
      await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });


    if (error) {

      showMessage(
        error.message,
        "error"
      );

      button.disabled = false;
      button.textContent = "Sign In";

      return;
    }


    showMessage(
      "Login successful!",
      "success"
    );


    setTimeout(() => {

      window.location.href = "dashboard.html";

    }, 800);

  });

</script>

</body>
</html>
